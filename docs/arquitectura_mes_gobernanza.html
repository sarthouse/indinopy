<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquitectura Institucional MES - Visor MD Nativo</title>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Mermaid -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-body: #0a0e17;
            --bg-card: #111827;
            --border-color: #1f2937;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --accent: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            line-height: 1.6;
            font-size: 14px;
        }

        .doc-container {
            max-width: 960px;
            margin: 0 auto;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 36px 44px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .doc-header-badge {
            display: inline-block;
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--primary-hover);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        h1,
        h2,
        h3,
        h4 {
            color: #f8fafc;
            margin-top: 1.4em;
            margin-bottom: 0.6em;
            line-height: 1.3;
        }

        h1 {
            font-size: 26px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: #60a5fa;
            margin-top: 0;
        }

        h2 {
            font-size: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 6px;
            color: #93c5fd;
        }

        h3 {
            font-size: 16px;
            color: #bfdbfe;
        }

        p,
        ul,
        ol {
            margin-top: 0.6em;
            margin-bottom: 0.8em;
            color: #cbd5e1;
        }

        li {
            margin-bottom: 0.3em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 13px;
        }

        th,
        td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background-color: rgba(255, 255, 255, 0.05);
            color: #93c5fd;
            font-weight: 700;
        }

        tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.02);
        }

        blockquote {
            border-left: 4px solid var(--primary);
            background-color: rgba(59, 130, 246, 0.08);
            padding: 10px 16px;
            margin: 16px 0;
            border-radius: 0 6px 6px 0;
            color: #cbd5e0;
        }

        code {
            background-color: rgba(255, 255, 255, 0.08);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12.5px;
            color: #f1f5f9;
        }

        pre {
            background-color: #030712;
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 6px;
            overflow-x: auto;
        }

        pre code {
            background-color: transparent;
            padding: 0;
            border-radius: 0;
        }

        /* MERMAID INTERACTIVE WRAPPER */
        .mermaid-wrapper {
            background-color: #030712;
            border: 1px solid #1f2937;
            border-radius: 8px;
            margin: 24px 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s;
        }

        .mermaid-wrapper.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9999;
            margin: 0;
            border-radius: 0;
            height: 100vh;
        }

        .mermaid-wrapper:hover {
            border-color: #374151;
        }

        .mermaid-header {
            background-color: #0f172a;
            border-bottom: 1px solid #1f2937;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .mermaid-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
        }

        .mermaid-controls {
            display: flex;
            gap: 6px;
        }

        .m-btn {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid #334155;
            color: #cbd5e1;
            border-radius: 4px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .m-btn:hover {
            background-color: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .mermaid-viewport {
            position: relative;
            width: 100%;
            height: auto;
            min-height: 200px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            padding: 20px;
            box-sizing: border-box;
            cursor: grab;
        }

        .mermaid-viewport:active {
            cursor: grabbing;
        }

        .mermaid-wrapper.fullscreen .mermaid-viewport {
            height: calc(100vh - 36px);
            flex-grow: 1;
        }

        .mermaid-wrapper.collapsed .mermaid-viewport {
            display: none;
        }

        .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 8px 0;
            max-width: 100%;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 28px 0;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-style: italic;
        }

        .error {
            color: #ef4444;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="doc-container">
        <span class="doc-header-badge">📚 Visor Nativo Markdown</span>
        <div id="content">
            <div class="loading">Cargando documento original "arquitectura_mes_gobernanza.md"...</div>
        </div>
    </div>

    <script>
        // Configuración inicial de Mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'loose'
        });

        // Configuración de Marked para interceptar bloques de código Mermaid
        marked.use({
            renderer: {
                code(tokenOrCode) {
                    const codeText = typeof tokenOrCode === 'object' ? tokenOrCode.text : arguments[0];
                    const lang = typeof tokenOrCode === 'object' ? tokenOrCode.lang : arguments[1];

                    if (lang === 'mermaid') {
                        return `
                <div class="mermaid-wrapper">
                    <div class="mermaid-header">
                        <div class="mermaid-title">📊 Diagrama Mermaid</div>
                        <div class="mermaid-controls">
                            <button class="m-btn btn-zoom-in" title="Acercar">➕</button>
                            <button class="m-btn btn-zoom-out" title="Alejar">➖</button>
                            <button class="m-btn btn-reset" title="Restaurar">🔄</button>
                            <button class="m-btn btn-fullscreen" title="Pantalla Completa">⛶</button>
                            <button class="m-btn btn-collapse" title="Expandir/Contraer">▼</button>
                        </div>
                    </div>
                    <div class="mermaid-viewport">
                        <div class="mermaid" style="transform: scale(1) translate(0px, 0px); transition: transform 0.1s ease-out; transform-origin: center;">${codeText}</div>
                    </div>
                </div>`;
                    }
                    return false; // Delega al renderizador por defecto para python, etc.
                }
            }
        });

        async function loadMarkdown() {
            try {
                // Hacemos el fetch() al archivo MD que está en la misma carpeta
                const response = await fetch('arquitectura_mes_gobernanza.md');

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status} - No se pudo cargar el archivo.`);
                }

                const markdownText = await response.text();

                // Parseamos el markdown a HTML en memoria
                const htmlContent = marked.parse(markdownText);

                // Inyectamos el HTML dinámicamente
                const contentDiv = document.getElementById('content');
                contentDiv.innerHTML = htmlContent;

                // Renderizamos la sintaxis matemática de KaTeX ($ y $$)
                renderMathInElement(contentDiv, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false },
                        { left: '\\(', right: '\\)', display: false },
                        { left: '\\[', right: '\\]', display: true }
                    ],
                    throwOnError: false
                });

                // Renderizamos los diagramas de Mermaid que acabamos de inyectar
                const mermaidElements = document.querySelectorAll('.mermaid');
                if (mermaidElements.length > 0) {
                    await mermaid.run({ nodes: mermaidElements });

                    // Inicializar interactividad (Zoom, Pan, Fullscreen)
                    document.querySelectorAll('.mermaid-wrapper').forEach(wrapper => {
                        const viewport = wrapper.querySelector('.mermaid-viewport');
                        const mermaidDiv = wrapper.querySelector('.mermaid');
                        const btnZoomIn = wrapper.querySelector('.btn-zoom-in');
                        const btnZoomOut = wrapper.querySelector('.btn-zoom-out');
                        const btnReset = wrapper.querySelector('.btn-reset');
                        const btnFullscreen = wrapper.querySelector('.btn-fullscreen');
                        const btnCollapse = wrapper.querySelector('.btn-collapse');

                        let scale = 1, translateX = 0, translateY = 0;
                        let isDragging = false, startX, startY;

                        const updateTransform = () => {
                            mermaidDiv.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
                        };

                        btnZoomIn.onclick = () => { scale *= 1.2; updateTransform(); };
                        btnZoomOut.onclick = () => { scale /= 1.2; updateTransform(); };
                        btnReset.onclick = () => { scale = 1; translateX = 0; translateY = 0; updateTransform(); };

                        btnCollapse.onclick = () => {
                            wrapper.classList.toggle('collapsed');
                            btnCollapse.textContent = wrapper.classList.contains('collapsed') ? '▶' : '▼';
                        };

                        btnFullscreen.onclick = () => {
                            wrapper.classList.toggle('fullscreen');
                        };

                        viewport.addEventListener('mousedown', (e) => {
                            isDragging = true;
                            startX = e.clientX - translateX;
                            startY = e.clientY - translateY;
                            viewport.style.cursor = 'grabbing';
                        });

                        window.addEventListener('mousemove', (e) => {
                            if (!isDragging) return;
                            translateX = e.clientX - startX;
                            translateY = e.clientY - startY;
                            mermaidDiv.style.transition = 'none';
                            updateTransform();
                        });

                        window.addEventListener('mouseup', () => {
                            isDragging = false;
                            viewport.style.cursor = 'grab';
                            mermaidDiv.style.transition = 'transform 0.1s ease-out';
                        });

                        window.addEventListener('mouseleave', () => {
                            if (isDragging) {
                                isDragging = false;
                                viewport.style.cursor = 'grab';
                                mermaidDiv.style.transition = 'transform 0.1s ease-out';
                            }
                        });

                        viewport.addEventListener('wheel', (e) => {
                            e.preventDefault();
                            scale *= e.deltaY < 0 ? 1.1 : 0.9;
                            updateTransform();
                        }, { passive: false });
                    });
                }

            } catch (error) {
                console.warn('Error loading Markdown via fetch (CORS block on file://). Falling back to manual file input.', error);

                document.getElementById('content').innerHTML = `
                    <div class="error" style="background-color: transparent; border-color: #3b82f6; text-align: center;">
                        <h3 style="color: #60a5fa;">Carga Local Requerida</h3>
                        <p style="color: #cbd5e1; margin-bottom: 20px;">Estás abriendo el archivo localmente (file://), por lo que el navegador bloquea la carga automática por seguridad.</p>
                        
                        <div style="padding: 20px; border: 2px dashed #3b82f6; border-radius: 8px; background: rgba(59, 130, 246, 0.05); display: inline-block;">
                            <p style="margin-top: 0; font-weight: bold; color: #93c5fd;">Por favor, seleccioná manualmente el archivo .md:</p>
                            <input type="file" id="file-input" accept=".md,.txt" style="color: #e2e8f0; font-size: 14px; padding: 10px; cursor: pointer;">
                        </div>
                    </div>
                `;

                // Agregar listener para el selector de archivos
                document.getElementById('file-input').addEventListener('change', function (e) {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const markdownText = e.target.result;

                        // Parsear y renderizar (misma lógica que el try)
                        const htmlContent = marked.parse(markdownText);
                        const contentDiv = document.getElementById('content');
                        contentDiv.innerHTML = htmlContent;

                        renderMathInElement(contentDiv, {
                            delimiters: [
                                { left: '$$', right: '$$', display: true },
                                { left: '$', right: '$', display: false },
                                { left: '\\(', right: '\\)', display: false },
                                { left: '\\[', right: '\\]', display: true }
                            ],
                            throwOnError: false
                        });

                        const mermaidElements = document.querySelectorAll('.mermaid');
                        if (mermaidElements.length > 0) {
                            mermaid.run({ nodes: mermaidElements });
                        }
                    };
                    reader.readAsText(file);
                });
            }
        }

        // Ejecutamos la lógica principal al cargar la estructura del DOM
        document.addEventListener('DOMContentLoaded', loadMarkdown);
    </script>
</body>

</html>
