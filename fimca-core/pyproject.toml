[project]
name = "fimca-core"
version = "0.1.0"
description = "FIMCA Core - Nodo Central Fiduciario (FDI), Gobernanza Sectorial y PKI"
authors = [{ name = "Gabriel Sarthou" }]
dependencies = [
    "django>=6.1.1",
    "djangorestframework>=3.18.1",
    "django-simple-history>=3.13.0",
    "django-import-export>=4.4.1",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "requests>=2.31.0",
    "pynacl>=1.5.0",
    "celery>=5.6.3",
    "redis>=8.1.0",
    "uuid6>=2025.0.1",
    "pillow>=12.3.0",
    "uvicorn>=0.53.0",
    "weasyprint>=70.0",
    "playwright>=1.63.0",
    "pypdf>=5.0.0",
]

[tool.ruff]
extend-exclude = ["*/migrations/*", ".venv", "venv"]
line-length = 88 

[tool.ruff.lint]
select = ["E", "F", "DJ", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
