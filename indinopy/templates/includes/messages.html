<!-- Componente de Mensajes / Toast Flash: indinopy/templates/includes/messages.html -->
<div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col space-y-3 max-w-md w-full px-4 pointer-events-none">
    {% if messages %}
        {% for message in messages %}
        <div class="pointer-events-auto flex items-start p-4 rounded-xl shadow-lg border backdrop-blur-sm transition-all duration-300 transform translate-y-0
            {% if message.tags == 'success' %}
                bg-emerald-50 border-emerald-200 text-emerald-900 dark:bg-emerald-950/80 dark:border-emerald-800 dark:text-emerald-200
            {% elif message.tags == 'error' %}
                bg-rose-50 border-rose-200 text-rose-900 dark:bg-rose-950/80 dark:border-rose-800 dark:text-rose-200
            {% elif message.tags == 'warning' %}
                bg-amber-50 border-amber-200 text-amber-900 dark:bg-amber-950/80 dark:border-amber-800 dark:text-amber-200
            {% else %}
                bg-blue-50 border-blue-200 text-blue-900 dark:bg-blue-950/80 dark:border-blue-800 dark:text-blue-200
            {% endif %}"
            role="alert"
            x-data="{ show: true }"
            x-show="show"
            x-init="setTimeout(() => show = false, 5000)">
            
            <div class="flex-shrink-0 mt-0.5">
                {% if message.tags == 'success' %}
                    <svg class="w-5 h-5 text-emerald-600 dark:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                {% elif message.tags == 'error' %}
                    <svg class="w-5 h-5 text-rose-600 dark:text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                {% elif message.tags == 'warning' %}
                    <svg class="w-5 h-5 text-amber-600 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                {% else %}
                    <svg class="w-5 h-5 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                {% endif %}
            </div>

            <div class="ml-3 flex-1 text-sm font-medium">
                {{ message }}
            </div>

            <button type="button" 
                    onclick="this.closest('[role=alert]').remove()" 
                    class="ml-3 inline-flex text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 focus:outline-none">
                <span class="sr-only">Cerrar</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        {% endfor %}
    {% endif %}
</div>
