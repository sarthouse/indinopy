<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Bauhaus Modular Frame -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="10" y="10" width="100" height="100" rx="18" stroke="url(#bridgeGrad)" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4" />

  <!-- Subtle Bauhaus Construction Grid -->
  <line x1="24" y1="10" x2="24" y2="110" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
  <line x1="96" y1="10" x2="96" y2="110" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
  <line x1="10" y1="26" x2="110" y2="26" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
  <line x1="10" y1="94" x2="110" y2="94" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />

  <!-- "I" Pillar (Modular ERP Block + Node Top) -->
  <circle cx="31" cy="33" r="7" fill="url(#emeraldGrad)" />
  <rect x="24" y="46" width="14" height="48" rx="3" fill="url(#emeraldGrad)" />

  <!-- "N" Left Stem -->
  <rect x="48" y="26" width="14" height="68" rx="3" fill="#e2e8f0" />

  <!-- "N" Right Stem -->
  <rect x="82" y="26" width="14" height="68" rx="3" fill="url(#cyanGrad)" />

  <!-- "N" Diagonal Bauhaus Crossbar (Federated Bridge) -->
  <polygon points="48,26 63,26 96,94 81,94" fill="url(#bridgeGrad)" />

  <!-- Cryptographic Node Accents -->
  <circle cx="55" cy="33" r="3" fill="#0a0e17" />
  <circle cx="89" cy="87" r="3" fill="#0a0e17" />
</svg>
